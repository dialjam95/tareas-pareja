<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f5bd5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <title>Tareas de a dos</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div id="login" class="lg" hidden>
    <div class="lgc">
      <div class="brand" style="padding:0"><span class="logo">✓</span>Tareas de a dos</div>
      <input id="em" type="email" placeholder="Correo" autocomplete="username">
      <input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password">
      <button class="pri" id="in">Entrar</button>
      <div id="err"></div>
    </div>
  </div>

  <div id="app" class="shell" hidden>
    <aside>
      <div class="brand"><span class="logo">✓</span>Tareas de a dos</div>
      <nav class="nav" id="nav"></nav>
      <div class="grow"></div>
      <button id="cfgb">⚙ Ajustes</button>
    </aside>
    <section class="main">
      <header class="top">
        <div>
          <h1 id="ttl">Todas las tareas</h1>
          <div class="sub" id="sub"></div>
        </div>
        <div class="acts"><input id="q" type="search" placeholder="Buscar tareas" aria-label="Buscar">
          <div class="seg" id="seg"></div><button class="pri" id="new">+ Nueva tarea</button>
        </div>
      </header>
      <div id="bn" hidden></div>
      <div class="stats" id="stats"></div>
      <div class="prog"><i id="pg"></i></div>
      <div class="qa"><input id="qa" placeholder="＋ Escribe una tarea y pulsa Enter" maxlength="120"
          enterkeyhint="done">
        <div class="hint" id="qh"></div>
      </div>
      <div class="tw" id="lst">
        <table>
          <thead>
            <tr>
              <th>Tarea</th>
              <th>Acción</th>
              <th>Encargado</th>
              <th>Recordatorio</th>
              <th>Estado</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tb"></tbody>
        </table>
      </div>
      <div class="board" id="bd" hidden></div>
    </section>
  </div>

  <dialog id="dlg">
    <h2 id="mt">Nueva tarea</h2>
    <input id="cosa" placeholder="¿Qué hay que hacer? (ej. Cita del dentista)" maxlength="120">
    <div class="row"><select id="acc" aria-label="Acción"></select><select id="per" aria-label="Encargado"></select>
    </div>
    <label class="lbl" for="fec">Recordatorio</label><input id="fec" type="datetime-local">
    <div class="chips" id="qd"></div>
    <div class="row" style="margin-top:0">
      <select id="avi" aria-label="Aviso">
        <option value="0">Avisar a la hora</option>
        <option value="15">15 min antes</option>
        <option value="60">1 hora antes</option>
        <option value="1440">1 día antes</option>
      </select>
      <select id="rep" aria-label="Repetición">
        <option value="">No se repite</option>
        <option value="diaria">Cada día</option>
        <option value="semanal">Cada semana</option>
        <option value="mensual">Cada mes</option>
      </select>
    </div>
    <div class="btns"><button id="cancel" type="button">Cancelar</button><button class="pri" id="go"
        type="button">Guardar tarea</button></div>
  </dialog>

  <dialog id="cfg">
    <h2>Ajustes</h2>
    <label class="lbl" for="yo" style="margin-top:0">¿Quién eres? Así recibes solo tus avisos</label><select
      id="yo"></select>
    <button id="notif" style="margin-top:10px">🔔 Activar avisos</button>
    <label class="lbl">Personas</label>
    <div class="chips" id="cp"></div>
    <div class="add"><input id="np" placeholder="Nueva persona" maxlength="30"><button id="ap">Añadir</button></div>
    <label class="lbl">Acciones</label>
    <div class="chips" id="ca"></div>
    <div class="add"><input id="na" placeholder="Nueva acción" maxlength="30"><button id="aa">Añadir</button></div>
    <div class="btns"><button id="out">Cerrar sesión</button><button class="pri" id="cfgx">Listo</button></div>
  </dialog>
  <dialog id="cdel" style="width:min(92vw,400px);text-align:center">
    <div class="bin"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor"
        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 7h16" />
        <path d="M10 11v6M14 11v6" />
        <path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12" />
        <path d="M9 7V4h6v3" />
      </svg></div>
    <h2 style="margin-top:12px">¿Seguro que deseas borrar la tarea?</h2>
    <div class="sub" id="cdt"></div>
    <div class="btns"><button id="cdno" type="button">Cancelar</button><button class="dng" id="cdsi"
        type="button">Borrar tarea</button></div>
  </dialog>
  <div id="toast" class="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>

</html>
